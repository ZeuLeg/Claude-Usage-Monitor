name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish ClaudeUsageMonitor.csproj
          -c Release
          -r win-x64
          --no-self-contained
          -p:PublishSingleFile=true
          -o publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ github.ref_name }}
          generate_release_notes: true
          files: publish/ClaudeUsageMonitor.exe
