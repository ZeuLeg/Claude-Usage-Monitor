name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ClaudeUsageMonitor.sln

      - name: Build
        run: dotnet build ClaudeUsageMonitor.sln --no-restore -c Release

      - name: Test
        run: dotnet test ClaudeUsageMonitor.sln --no-build -c Release --verbosity normal
